<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bune — Bluesky</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
        }

        #feed {
            width: 100%;
            height: 520px;
            overflow-y: auto;
            padding: 10px;
        }

        .post {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .author {
            font-size: 14px;
            font-weight: bold;
        }

        .handle {
            font-size: 12px;
            color: #777;
        }

        .date {
            margin-left: auto;
            font-size: 11px;
            color: #888;
            white-space: nowrap;
        }

        .text {
            font-size: 14px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .images {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .images img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 7px;
        }

        .video {
            display: block;
            width: 100%;
            max-height: 420px;
            margin-top: 10px;
            border-radius: 7px;
            background: #000;
        }

        .video-thumb {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 7px;
            margin-top: 10px;
        }

        .post-link {
            display: inline-block;
            margin-top: 10px;
            color: #0085ff;
            text-decoration: none;
            font-size: 12px;
        }

        .post-link:hover {
            text-decoration: underline;
        }

        .status {
            padding: 20px;
            text-align: center;
            color: #777;
            font-size: 13px;
        }

        #loading {
            padding: 15px;
            text-align: center;
            color: #777;
            font-size: 12px;
        }

        #feed::-webkit-scrollbar {
            width: 7px;
        }

        #feed::-webkit-scrollbar-thumb {
            background: #bbb;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div id="feed">
    <div class="status">Loading…</div>
</div>

<script>

const ACTOR = "bune.bsky.social";

const feed = document.getElementById("feed");

let cursor = null;
let loading = false;
let finished = false;


/* ---------------------------------
   LOAD POSTS
--------------------------------- */

async function loadPosts() {

    if (loading || finished) {
        return;
    }

    loading = true;

    const oldLoading = document.getElementById("loading");

    if (!oldLoading) {

        const loadingElement = document.createElement("div");

        loadingElement.id = "loading";
        loadingElement.textContent = "Loading more posts…";

        feed.appendChild(loadingElement);
    }

    try {

        let url =
            "https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed" +
            "?actor=" + encodeURIComponent(ACTOR) +
            "&limit=50" +
            "&filter=posts_no_replies";

        if (cursor) {
            url += "&cursor=" + encodeURIComponent(cursor);
        }

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Bluesky API error");
        }

        const data = await response.json();

        const loadingElement =
            document.getElementById("loading");

        if (loadingElement) {
            loadingElement.remove();
        }

        if (!data.feed || data.feed.length === 0) {

            finished = true;

            const end = document.createElement("div");

            end.id = "loading";
            end.textContent = "No more posts.";

            feed.appendChild(end);

            return;
        }


        /* Remove initial message */

        const status =
            feed.querySelector(".status");

        if (status) {
            status.remove();
        }


        /* Add posts */

        data.feed.forEach(item => {

            const post = item.post;

            addPost(post);

        });


        /* Next page */

        cursor = data.cursor || null;

        if (!cursor) {
            finished = true;
        }

    }

    catch (error) {

        console.error(error);

        const loadingElement =
            document.getElementById("loading");

        if (loadingElement) {
            loadingElement.remove();
        }

        const errorElement =
            document.createElement("div");

        errorElement.id = "loading";
        errorElement.textContent =
            "Unable to load more posts.";

        feed.appendChild(errorElement);
    }

    loading = false;
}


/* ---------------------------------
   CREATE POST
--------------------------------- */

function addPost(post) {

    const record = post.record;
    const author = post.author;

    const postElement =
        document.createElement("div");

    postElement.className = "post";


    /* Date */

    const date =
        new Date(record.createdAt);

    const formattedDate =
        date.toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });


    /* Media */

    let mediaHTML = "";


    /*
       IMAGES
    */

    if (
        post.embed &&
        post.embed.images &&
        Array.isArray(post.embed.images)
    ) {

        mediaHTML = `
            <div class="images">

                ${post.embed.images.map(image => `

                    <img
                        src="${image.fullsize || image.thumb}"
                        alt="${escapeHTML(image.alt || "")}"
                        loading="lazy"
                    >

                `).join("")}

            </div>
        `;
    }


    /*
       VIDEO
    */

    else if (
        post.embed &&
        post.embed.playlist
    ) {

        mediaHTML = `
            <video
                class="video"
                controls
                playsinline
                preload="metadata"
                poster="${post.embed.thumbnail || ""}"
            >

                <source
                    src="${post.embed.playlist}"
                    type="application/x-mpegURL"
                >

            </video>
        `;
    }


    /*
       VIDEO THUMBNAIL
    */

    else if (
        post.embed &&
        post.embed.thumbnail
    ) {

        mediaHTML = `
            <a
                href="${getPostURL(post)}"
                target="_blank"
                rel="noopener noreferrer"
            >

                <img
                    class="video-thumb"
                    src="${post.embed.thumbnail}"
                    alt="Bluesky video"
                    loading="lazy"
                >

            </a>
        `;
    }


    /*
       AVATAR
    */

    const avatarHTML =
        author.avatar
        ? `
            <img
                class="avatar"
                src="${author.avatar}"
                alt=""
                loading="lazy"
            >
        `
        : "";


    /*
       POST URL
    */

    const postURL =
        getPostURL(post);


    /*
       HTML
    */

    postElement.innerHTML = `

        <div class="post-header">

            ${avatarHTML}

            <div>

                <div class="author">
                    ${escapeHTML(
                        author.displayName ||
                        author.handle
                    )}
                </div>

                <div class="handle">
                    @${escapeHTML(author.handle)}
                </div>

            </div>

            <div class="date">
                ${formattedDate}
            </div>

        </div>


        <div class="text">
            ${escapeHTML(record.text || "")}
        </div>


        ${mediaHTML}


        <a
            class="post-link"
            href="${postURL}"
            target="_blank"
            rel="noopener noreferrer"
        >
            View on Bluesky
        </a>

    `;


    feed.appendChild(postElement);
}


/* ---------------------------------
   BLUESKY POST URL
--------------------------------- */

function getPostURL(post) {

    const rkey =
        post.uri.split("/").pop();

    return (
        "https://bsky.app/profile/" +
        encodeURIComponent(
            post.author.handle
        ) +
        "/post/" +
        encodeURIComponent(rkey)
    );
}


/* ---------------------------------
   ESCAPE HTML
--------------------------------- */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* ---------------------------------
   INFINITE SCROLL
--------------------------------- */

feed.addEventListener("scroll", () => {

    const distanceFromBottom =
        feed.scrollHeight -
        feed.scrollTop -
        feed.clientHeight;

    if (distanceFromBottom < 300) {

        loadPosts();
    }

});


/* ---------------------------------
   INITIAL LOAD
--------------------------------- */

loadPosts();


/* ---------------------------------
   REFRESH NEW POSTS
   Every 5 minutes
--------------------------------- */

setInterval(() => {

    location.reload();

}, 5 * 60 * 1000);

</script>

</body>
</html>
